# Préprod derrière le Traefik de Coolify : preprod.auspex.orphane.fr.
# Projet, volume et routeurs distincts de la prod : la base SQLite de la préprod est indépendante.
name: auspex-preprod

services:
  auspex:
    build: .
    restart: unless-stopped
    volumes:
      - auspex-preprod-data:/data
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.auspex-preprod-http.entrypoints=http
      - traefik.http.routers.auspex-preprod-http.rule=Host(`preprod.auspex.orphane.fr`)
      - traefik.http.routers.auspex-preprod-http.middlewares=auspex-preprod-https
      - traefik.http.middlewares.auspex-preprod-https.redirectscheme.scheme=https
      - traefik.http.routers.auspex-preprod.entrypoints=https
      - traefik.http.routers.auspex-preprod.rule=Host(`preprod.auspex.orphane.fr`)
      - traefik.http.routers.auspex-preprod.tls=true
      - traefik.http.routers.auspex-preprod.tls.certresolver=letsencrypt
      - traefik.http.services.auspex-preprod.loadbalancer.server.port=3001

volumes:
  auspex-preprod-data:

networks:
  coolify:
    external: true
