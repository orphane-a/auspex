# Déploiement derrière le Traefik de Coolify (réseau « coolify », certificat Let's Encrypt).
services:
  auspex:
    build: .
    restart: unless-stopped
    volumes:
      - auspex-data:/data
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.auspex-http.entrypoints=http
      - traefik.http.routers.auspex-http.rule=Host(`auspex.orphane.fr`)
      - traefik.http.routers.auspex-http.middlewares=auspex-https
      - traefik.http.middlewares.auspex-https.redirectscheme.scheme=https
      - traefik.http.routers.auspex.entrypoints=https
      - traefik.http.routers.auspex.rule=Host(`auspex.orphane.fr`)
      - traefik.http.routers.auspex.tls=true
      - traefik.http.routers.auspex.tls.certresolver=letsencrypt
      - traefik.http.services.auspex.loadbalancer.server.port=3001

  # Instance de démo du scénario guidé (ticket 97) : même image, base séparée
  # (volume dédié) et SCENARIO=dragon. Elle ne partage aucune donnée avec la table
  # de Djoko, servie par le service « auspex » ci-dessus, qui reste inchangé.
  # Ambiance Médiéval (ticket 101) : portée par le scénario, réappliquée à chaque
  # démarrage, même sur un volume existant (personnages et code conservés).
  auspex-demo:
    build: .
    restart: unless-stopped
    environment:
      - SCENARIO=dragon
    volumes:
      - auspex-demo-data:/data
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.auspex-demo-http.entrypoints=http
      - traefik.http.routers.auspex-demo-http.rule=Host(`demo.auspex.orphane.fr`)
      - traefik.http.routers.auspex-demo-http.middlewares=auspex-demo-https
      - traefik.http.middlewares.auspex-demo-https.redirectscheme.scheme=https
      - traefik.http.routers.auspex-demo.entrypoints=https
      - traefik.http.routers.auspex-demo.rule=Host(`demo.auspex.orphane.fr`)
      - traefik.http.routers.auspex-demo.tls=true
      - traefik.http.routers.auspex-demo.tls.certresolver=letsencrypt
      - traefik.http.services.auspex-demo.loadbalancer.server.port=3001
volumes:
  auspex-data:
  auspex-demo-data:

networks:
  coolify:
    external: true
